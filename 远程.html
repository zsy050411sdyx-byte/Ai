<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Posture Guard · 体态守护 · 자세 지킴이</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#f4f7fb;--card:#fff;--tx:#17243a;--mu:#64758f;--ac:#2563eb;--ac2:#e8effd;--bd:#dbe3ef;--warn:#c2410c;--ok:#15803d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1521;--card:#171f2e;--tx:#e6edf8;--mu:#8fa0ba;--ac:#6ea0ff;--ac2:#1b2a47;--bd:#26324a;--warn:#fb923c;--ok:#4ade80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1521;--card:#171f2e;--tx:#e6edf8;--mu:#8fa0ba;--ac:#6ea0ff;--ac2:#1b2a47;--bd:#26324a;--warn:#fb923c;--ok:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei","Malgun Gothic",sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mu);font-size:13px;margin:0 0 12px;max-width:640px}
.lang{display:flex;gap:4px}.lang button{padding:5px 11px;font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:820px){.grid{grid-template-columns:1.15fr 1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.cam{position:relative;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden}
.cam .m{position:absolute;inset:0;transform:scaleX(-1)}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px;background:rgba(0,0,0,.55);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
button:disabled{opacity:.55;cursor:default}
.tip{font-size:13px;color:var(--mu)}.warn{color:var(--warn)}
.tc{padding:8px 0;border-bottom:1px dashed var(--bd)}
.tc .h{display:flex;justify-content:space-between;font-size:14px}
.chip{font-size:12px;padding:1px 8px;border-radius:9px;background:var(--ac2);color:var(--ok)}
.chip.bad{color:var(--warn);background:rgba(251,146,60,.15)}
.bar{height:8px;background:var(--ac2);border-radius:5px;overflow:hidden;margin:5px 0 2px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .15s}
.k{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--bd);font-size:14px}
.k b{font-variant-numeric:tabular-nums}
h2{font-size:15px;margin:12px 0 6px}
.big{font-size:36px;font-weight:700;color:var(--ac);line-height:1.1}
.note{margin-top:12px;font-size:12px;color:var(--mu)}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:9;padding:20px}
#modal .b{background:var(--card);border:2px solid var(--warn);border-radius:16px;padding:20px;max-width:360px;text-align:center}
#modal h3{margin:0 0 6px;color:var(--warn)}
</style>
</head>
<body>
<main>
<div class="top"><div><h1 data-t="title"></h1><p class="sub" data-t="sub"></p></div>
<div class="lang"><button id="l-zh">中文</button><button id="l-en">English</button><button id="l-ko">한국어</button></div></div>
<div class="grid">
<section class="card">
<div class="cam"><div class="m"><video id="v" playsinline muted></video><canvas id="c"></canvas></div><div class="ov" id="ov"></div></div>
<div class="row">
<button class="p" id="start" data-t="start"></button>
<button id="cal" data-t="cal" disabled></button>
<button id="snd"></button>
</div>
<p class="tip" id="msg"></p>
</section>
<section class="card">
<div class="row" style="margin-top:0"><button id="tM" data-t="tabM"></button><button id="tT" data-t="tabT"></button></div>
<div id="pM">
<div id="cards"></div>
<h2 data-t="mT"></h2>
<div id="mets"></div>
<h2 data-t="todayT"></h2>
<div id="today"></div>
</div>
<div id="pT" style="display:none">
<h2 data-t="recT"></h2><p class="tip" id="recs" style="margin:0"></p>
<div class="row" id="exb"></div>
<p class="tip" id="exd" style="margin:8px 0 0"></p>
<div style="margin-top:8px"><div class="tip" data-t="repsT"></div><div class="big"><span id="reps">0</span><span style="font-size:16px;color:var(--mu)"> / 3</span></div>
<div class="tip" data-t="ampT"></div><div class="bar"><i id="pb"></i></div>
<div class="tip" data-t="holdT"></div><div class="bar"><i id="hb"></i></div>
<div class="tip" id="form"></div></div>
</div>
</section>
</div>
<p class="note" data-t="note"></p>
</main>
<div id="modal"><div class="b"><h3 data-t="alT"></h3><p id="almsg"></p><button class="p" id="alok" data-t="alOk"></button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>

 $('exb').innerHTML=[0,1,2,3].map(i=>'<button id="ex'+i+'"></button>').join('');
 [0,1,2,3].forEach(i=>$('ex'+i).onclick=()=>pickEx(i));
}
function recList(){return TY.filter(k=>rec.c[k]>0).sort((a,b)=>rec.c[b]-rec.c[a]).slice(0,2)}
const exOf=k=>TY.indexOf(k);
function tgtSide(){const s=rec.sd.tilt;return s.L>s.R?'R':'L'}
function renderStatic(){
 const T_=t();
 document.documentElement.lang=T_.hl;
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T_[e.dataset.t]);
 $('start').textContent=T_[startKey];$('msg').textContent=msgFn();$('ov').textContent=ovFn();
 $('snd').textContent=sound?T_.snd1:T_.snd0;
 ['zh','en','ko'].forEach(k=>$('l-'+k).className=k===L?'on':'');
 TY.forEach(k=>$('n'+k).textContent=T_.types[k]);
 T_.m.forEach((x,i)=>$('mn'+i).textContent=x);
 const rl=recList(),star=ex=>rl.map(exOf).includes(ex)?T_.star:'';
 [0,1,2,3].forEach(i=>$('ex'+i).textContent=star(i)+T_.ex[i][0]);
 $('recs').textContent=rl.length?T_.recHas(rl.map(k=>T_.types[k]).join(' / ')):T_.recNone;
 $('exd').textContent=T_.ex[exI][1](T_.sw[tgtSide()]);
 renderToday();
}
function renderToday(){
 const T_=t(),n=Object.values(rec.c).reduce((a,b)=>a+b,0);
 $('today').innerHTML=[[T_.tA,n],[T_.tMin,Math.round(rec.sec/60)+' '+T_.min],[T_.tR,rec.tr]].map(x=>'<div class="k"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');
}
function pickEx(i){exI=i;reps=0;hold=0;locked=false;$('reps').textContent=0;[0,1,2,3].forEach(j=>$('ex'+j).className=j===i?'on':'');$('exd').textContent=t().ex[i][1](t().sw[tgtSide()])}
function setTab(x){tab=x;$('pM').style.display=x==='M'?'':'none';$('pT').style.display=x==='T'?'':'none';$('tM').className=x==='M'?'on':'';$('tT').className=x==='T'?'on':''}
$('tM').onclick=()=>setTab('M');
$('tT').onclick=()=>{const rl=recList();if(rl.length&&!reps)pickEx(exOf(rl[0]));setTab('T')};
['zh','en','ko'].forEach(k=>$('l-'+k).onclick=()=>{L=k;try{localStorage.setItem('plang',k)}catch(e){}renderStatic()});
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?t().snd1:t().snd0};
function beep(){if(!sound)return;try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=660;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.25)}catch(e){}}
let alT_;
function alert_(k,sd){
 $('almsg').textContent=t().al[k](sd?t().sw[sd]:'');
 $('modal').style.display='flex';beep();clearTimeout(alT_);alT_=setTimeout(()=>$('modal').style.display='none',12000);
}
$('alok').onclick=()=>{$('modal').style.display='none'};
const v=$('v'),c=$('c'),ctx=c.getContext('2d');
function measure(lm){
 const W=v.videoWidth,H=v.videoHeight,P=i=>({x:lm[i].x*W,y:lm[i].y*H,v:lm[i].visibility||0});
 const n=P(0),e7=P(7),e8=P(8),s11=P(11),s12=P(12),h23=P(23),h24=P(24);
 const sw=Math.hypot(s11.x-s12.x,s11.y-s12.y),deg=Math.PI/180;
 const sc={x:(s11.x+s12.x)/2,y:(s11.y+s12.y)/2},ec={x:(e7.x+e8.x)/2,y:(e7.y+e8.y)/2};
 const hip=h23.v>.5&&h24.v>.5&&h23.y>sc.y+sw*.5?{x:(h23.x+h24.x)/2,y:(h23.y+h24.y)/2}:null;
 return {tilt:Math.atan2(e7.y-e8.y,e7.x-e8.x)/deg,sa:Math.atan2(s11.y-s12.y,s11.x-s12.x)/deg,sw,nl:(s11.y-e7.y)/sw,nr:(s12.y-e8.y)/sw,
  drop:(sc.y-n.y)/sw,cx:sc.x,neck:Math.atan2(ec.x-sc.x,sc.y-ec.y)/deg,sp:hip?Math.atan2(sc.x-hip.x,hip.y-sc.y)/deg:null};
}
function rel(m){
 return {dt:m.tilt-base.tilt,dsa:m.sa-base.sa,dsh:(m.nl-m.nr)-(base.nl-base.nr),twist:1-m.sw/base.sw,dropR:m.drop/base.drop,
  shift:(m.cx-base.cx)/base.sw,dsp:m.sp!=null&&base.sp!=null?m.sp-base.sp:0,dneck:m.neck-base.neck,up:1-((m.nl+m.nr)/2)/((base.nl+base.nr)/2)};
}
function draw(lm){
 c.width=v.videoWidth;c.height=v.videoHeight;ctx.clearRect(0,0,c.width,c.height);
 const bad=Object.values(flag).some(Boolean);ctx.strokeStyle=bad?'#fb923c':'#34d399';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=4;
 const p=i=>[lm[i].x*c.width,lm[i].y*c.height];
 [[11,12],[7,8],[7,11],[8,12]].forEach(([a,b])=>{ctx.beginPath();ctx.moveTo(...p(a));ctx.lineTo(...p(b));ctx.stroke()});
 [0,7,8,11,12].forEach(i=>{ctx.beginPath();ctx.arc(...p(i),6,0,7);ctx.fill()});
}
function onRes(r){
 const lm=r.poseLandmarks;
 if(!lm||[0,7,8,11,12].some(i=>(lm[i].visibility||0)<.4)){ctx.clearRect(0,0,c.width,c.height);M=null;last=0;if(base)setMsg(()=>t().noPose);return}
 const raw=measure(lm);
 M=M?Object.fromEntries(Object.keys(raw).map(k=>[k,raw[k]==null||M[k]==null?raw[k]:M[k]*.6+raw[k]*.4])):raw;
 const now=performance.now(),dt=last?Math.min((now-last)/1000,.5):0;last=now;
 if(!base){draw(lm);return}
 R=rel(M);rec.sec+=dt;
 const f={tilt:Math.abs(R.dt)>8,shrug:Math.abs(R.dsh)>.07,lean:Math.abs(R.dsa)>6||R.twist>.12||Math.abs(R.shift)>.3||Math.abs(R.dsp)>6,head:R.dropR<.8};
 side.tilt=R.dt>0?'L':'R';side.shrug=R.dsh<0?'L':'R';
 TY.forEach(k=>{flag[k]=f[k];ema[k]+=((f[k]?1:0)-ema[k])*(1-Math.exp(-dt/10));
  if(ema[k]>.6&&now-(lastA[k]||0)>60000){lastA[k]=now;ema[k]=0;rec.c[k]++;if(side[k]&&rec.sd[k])rec.sd[k][side[k]]++;saveRec();alert_(k,rec.sd[k]?side[k]:'');renderStatic()}});
 draw(lm);ui();if(tab==='T')train(dt);
}
function ui(){
 const T_=t();
 TY.forEach(k=>{const e=$('c'+k);e.textContent=flag[k]?T_.bad:T_.ok;e.className='chip'+(flag[k]?' bad':'');
  $('b'+k).style.width=Math.min(ema[k]/.6,1)*100+'%';$('s'+k).textContent=T_.share+' '+Math.round(ema[k]*100)+'%'});
 const v_=[R.dt.toFixed(1)+'°',(R.dsh*100).toFixed(1)+'%',((M.nl-M.nr)*100).toFixed(1)+'%',M.neck.toFixed(1)+'°',M.sp==null?'--':M.sp.toFixed(1)+'°',(M.sw/base.sw*100).toFixed(0)+'%',(R.dropR*100).toFixed(0)+'%'];
 v_.forEach((x,i)=>$('mv'+i).textContent=x);
 if(msgFn()!==undefined&&$('msg').textContent===T_.noPose)setMsg(()=>T_.calOk);
}
function train(dt){
 const s=tgtSide()==='L'?1:-1,sh=Math.abs(R.dsh)<.07&&Math.abs(R.dsa)<6;let p=0,form='';
 if(exI===0){p=s*R.dt/15;form=sh?'':'sh'}
 else if(exI===1){p=R.up/.15;form=Math.abs(R.dsh)<.07?'':'sym'}
 else if(exI===2){p=s*R.dsa/10;form=Math.abs(R.dt)<6?'':'head'}
 else{p=(R.dropR-.97)/.08;form=sh&&Math.abs(R.dt)<6?'':'sh'}
 p=clamp(p,0,1.2);$('pb').style.width=Math.min(p,1)*100+'%';
 const need=HOLD[exI],ok=!form;
 $('form').textContent=p>.3?(ok?t().formOk:t().formBad[form]):'';$('form').className='tip'+(p>.3&&!ok?' warn':'');
 if(p>=1&&ok&&!locked){hold+=dt;$('hb').style.width=Math.min(hold/need,1)*100+'%';
  if(hold>=need){reps++;hold=0;locked=true;rec.tr++;saveRec();renderToday();$('reps').textContent=reps;
   if(reps>=3){setMsg(()=>t().done);reps=0;$('reps').textContent=0}else{const n=reps;setMsg(()=>t().repMsg(n))}}}
 else{if(p<.4)locked=false;if(!(p>=1&&ok)){hold=0;$('hb').style.width=0}}
}
$('cal').onclick=()=>{
 if(!M){setMsg(()=>t().noPose);return}
 base={tilt:M.tilt,sa:M.sa,sw:M.sw,nl:M.nl,nr:M.nr,drop:M.drop,cx:M.cx,sp:M.sp,neck:M.neck};
 TY.forEach(k=>ema[k]=0);setMsg(()=>t().calOk);
};
$('start').onclick=async()=>{
 if(run)return;
 $('start').disabled=true;startKey='starting';$('start').textContent=t().starting;
 try{
  if(typeof Pose==='undefined')throw new Error(t().noScript);
  const ps=new Pose({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/'+f});
  ps.setOptions({modelComplexity:1,smoothLandmarks:true,minDetectionConfidence:.5,minTrackingConfidence:.5});
  ps.onResults(onRes);
  const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:960},height:{ideal:720}},audio:false});
  v.srcObject=st;await v.play();
  $('ov').style.display='none';run=true;$('cal').disabled=false;startKey='on';$('start').textContent=t().on;
  let busy=false;
  (async function loop(){if(!busy&&v.readyState>=2){busy=true;try{await ps.send({image:v})}catch(e){}busy=false}requestAnimationFrame(loop)})();
 }catch(e){
  $('start').disabled=false;startKey='retry';$('start').textContent=t().retry;$('ov').style.display='flex';
  const d=e&&e.name==='NotAllowedError',em=e&&e.message?e.message:String(e);
  ovFn=()=>d?t().perm:t().fail(em);$('ov').textContent=ovFn();
 }
};
build();pickEx(0);setTab('M');renderStatic();
</script>
</body>
